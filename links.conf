# Symlink manifest for ./install
# Format: <source> <target> [force]
#   <source>  path relative to this repo
#   <target>  destination (~ is expanded)
#   force     optional; replace target even if it is a real file/dir
# Lines starting with # and blank lines are ignored.

zshrc          ~/.zshrc
zshenv         ~/.zshenv force
zprofile       ~/.zprofile force
gitconfig      ~/.gitconfig force
config/bat     ~/.config/bat force
config/btop    ~/.config/btop force
config/opencode ~/.config/opencode force
config/starship.toml ~/.config/starship.toml force
agents/skills  ~/.agents/skills   force
agents/skills  ~/.copilot/skills
agents/skills  ~/.claude/skills
config/ghostty/config ~/.config/ghostty/config force
config/ghostty/themes/catppuccin-latte.conf ~/.config/ghostty/themes/catppuccin-latte.conf force
config/ghostty/themes/catppuccin-frappe.conf ~/.config/ghostty/themes/catppuccin-frappe.conf force
config/ghostty/themes/catppuccin-macchiato.conf ~/.config/ghostty/themes/catppuccin-macchiato.conf force
config/ghostty/themes/catppuccin-mocha.conf ~/.config/ghostty/themes/catppuccin-mocha.conf force
config/claude/settings.json ~/.claude/settings.json force
config/codex/keybindings.json ~/.codex/keybindings.json force
config/cmux/cmux.json ~/.config/cmux/cmux.json force
config/gh/config.yml ~/.config/gh/config.yml force
config/yazi/theme.toml ~/.config/yazi/theme.toml force
.omo/omo.jsonc ~/.omo/omo.jsonc force
